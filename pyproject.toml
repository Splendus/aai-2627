[project]
name = "aaip"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  # Intel Macs: last PyTorch with Intel Mac support is 2.2.2 (Python <= 3.12, NumPy 1.x)
  "numpy>=2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.9 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchvision>=0.24 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchvision==0.17.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pandas", "matplotlib", "seaborn", "scikit-learn",
  "graphviz", "mnist1d", "jupyterlab",
]

[tool.uv]
python-preference = "only-managed"
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.12'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
